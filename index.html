<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>EDEFI – Consultas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1e14" />
    <style>
      /* Fallback inicial mientras carga React/MUI */
      body {
        margin: 0;
        background: #0b1e14;
        color: #cfe9dd;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
      }
      #root {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .loading {
        opacity: 0.7;
      }
    </style>

    <!-- Import maps para módulos ES desde CDN -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "@mui/material": "https://esm.sh/@mui/material@5.15.14",
          "@mui/material/": "https://esm.sh/@mui/material@5.15.14/",
          "@mui/icons-material": "https://esm.sh/@mui/icons-material@5.15.14",
          "@mui/icons-material/": "https://esm.sh/@mui/icons-material@5.15.14/",
          "@emotion/react": "https://esm.sh/@emotion/react@11.11.4",
          "@emotion/styled": "https://esm.sh/@emotion/styled@11.11.5"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading">Cargando EDEFI…</div>
    </div>

    <script type="module">
      import React, { useEffect, useMemo, useState } from "react";
      import { createRoot } from "react-dom/client";
      import {
        ThemeProvider,
        createTheme,
        CssBaseline,
        AppBar,
        Toolbar,
        Typography,
        Container,
        Grid,
        Paper,
        TextField,
        Button,
        Chip,
        Alert,
        Box,
        Divider,
        Table,
        TableHead,
        TableRow,
        TableCell,
        TableBody,
        IconButton,
        Link as MLink,
        Tooltip,
        Stack,
        Autocomplete,
      } from "@mui/material";
      import SearchIcon from "@mui/icons-material/Search";
      import SportsSoccerIcon from "@mui/icons-material/SportsSoccer";
      import styled from "@emotion/styled";

      // Utilidades
      const INDEX_URL = "./edefi_index.json";
      const COMP_URL = "./comparativa_general.json";
      const CATS = ["18", "12", "17", "13", "16", "15", "14"];

      const removeDiacritics = (s) =>
        (s || "").normalize("NFD").replace(/\p{Diacritic}/gu, "");

      const normTeam = (s) =>
        removeDiacritics(
          String(s || "")
            .trim()
            .toLowerCase()
        );
      const normCat = (cat) => {
        const s = String(cat || "").trim();
        if (/^20\d{2}$/.test(s)) return s.slice(-2);
        return s;
      };

      const findMatch = (idx, home, away, cat) => {
        if (!idx || !idx.matches_by_pair) return null;
        const k1 = `${home.toLowerCase()}||${away.toLowerCase()}`;
        const k2 = `${away.toLowerCase()}||${home.toLowerCase()}`;
        let entry = idx.matches_by_pair[k1];
        let inverted = false;
        if (!entry) {
          entry = idx.matches_by_pair[k2];
          inverted = !!entry;
        }
        if (!entry) return null;

        const catData = (entry.categorias || {})[cat] || {};
        let local = catData.home,
          visitante = catData.away;
        if (inverted) [local, visitante] = [visitante, local];

        const nota = inverted
          ? "Cruce encontrado con orden invertido en el otro torneo."
          : "Cruce exacto encontrado.";
        return {
          torneo: entry.torneo,
          jornada: entry.jornada,
          partido: entry.partido,
          estado: entry.estado,
          resultado: { local, visitante },
          nota,
        };
      };

      // Tema oscuro con verdes
      const theme = createTheme({
        palette: {
          mode: "dark",
          primary: { main: "#00b894" }, // verde/teal
          secondary: { main: "#26de81" }, // verde lima
          success: { main: "#2ecc71" },
          background: {
            default: "#0b1e14", // fondo principal oscuro verdoso
            paper: "#0f1a13", // cartas/containers
          },
          text: {
            primary: "#e0fff3",
            secondary: "#b7d2c7",
          },
        },
        shape: { borderRadius: 10 },
        components: {
          MuiPaper: {
            styleOverrides: {
              root: { border: "1px solid rgba(0, 184, 148, .15)" },
            },
          },
          MuiAppBar: {
            styleOverrides: {
              colorPrimary: {
                background: "linear-gradient(90deg,#0b1e14,#103323)",
              },
            },
          },
        },
        typography: {
          fontFamily:
            "Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif",
          h6: { fontWeight: 600 },
        },
      });

      function useQueryState() {
        const params = new URLSearchParams(location.search);
        const get = () => ({
          home: params.get("home") || "",
          away: params.get("away") || "",
          cat: params.get("cat") || "",
        });
        const set = (state) => {
          const p = new URLSearchParams();
          if (state.home) p.set("home", state.home);
          if (state.away) p.set("away", state.away);
          if (state.cat) p.set("cat", state.cat);
          const qs = p.toString();
          history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
        };
        return [get, set];
      }

      function App() {
        const [getQS, setQS] = useQueryState();
        const [indexData, setIndexData] = useState(null);
        const [compData, setCompData] = useState(null);
        const [lastModified, setLastModified] = useState(null);
        const [loading, setLoading] = useState(true);

        // Form state
        const [home, setHome] = useState("");
        const [away, setAway] = useState("");
        const [cat, setCat] = useState("");

        const [result, setResult] = useState(null);
        const [error, setError] = useState("");

        // Equipos para autocompletar
        const teamOptions = useMemo(() => {
          const set = new Set();
          if (compData && Array.isArray(compData)) {
            compData.forEach((r) => {
              if (r.Equipo) set.add(r.Equipo.trim());
            });
          }
          if (indexData && indexData.matches_by_pair) {
            Object.values(indexData.matches_by_pair).forEach((v) => {
              const a = (v.equipo_local || "").trim();
              const b = (v.equipo_visitante || "").trim();
              if (a) set.add(a);
              if (b) set.add(b);
            });
          }
          return Array.from(set).sort((a, b) => a.localeCompare(b, "es"));
        }, [indexData, compData]);

        // Tabla GENERAL ordenable
        const [orderBy, setOrderBy] = useState("Anual");
        const [orderDir, setOrderDir] = useState("desc");
        const [filterTeam, setFilterTeam] = useState("");

        const compRows = useMemo(() => {
          if (!Array.isArray(compData)) return [];
          let rows = compData.slice();
          const ft = normTeam(filterTeam);
          if (ft) rows = rows.filter((r) => normTeam(r.Equipo).includes(ft));
          rows.sort((a, b) => {
            const va = a[orderBy] ?? 0;
            const vb = b[orderBy] ?? 0;
            if (va === vb) return a.Equipo.localeCompare(b.Equipo, "es");
            return orderDir === "asc" ? va - vb : vb - va;
          });
          return rows;
        }, [compData, orderBy, orderDir, filterTeam]);

        const toggleSort = (key) => {
          if (orderBy !== key) {
            setOrderBy(key);
            setOrderDir("desc");
            return;
          }
          setOrderDir(orderDir === "desc" ? "asc" : "desc");
        };

        // Cargar datos
        useEffect(() => {
          let cancelled = false;
          async function load() {
            setLoading(true);
            setError("");
            try {
              const [ri, rc] = await Promise.all([
                fetch(INDEX_URL, { cache: "no-cache" }),
                fetch(COMP_URL, { cache: "no-cache" }),
              ]);
              // tomar el más nuevo
              setLastModified(
                ri.headers.get("last-modified") ||
                  rc.headers.get("last-modified")
              );
              const [idx, comp] = await Promise.all([ri.json(), rc.json()]);
              if (!cancelled) {
                setIndexData(idx);
                setCompData(comp);
              }
            } catch (e) {
              if (!cancelled)
                setError("No se pudieron cargar los datos publicados.");
            } finally {
              if (!cancelled) setLoading(false);
            }
          }
          load();
          return () => {
            cancelled = true;
          };
        }, []);

        // Leer query string inicial
        useEffect(() => {
          const qs = getQS();
          if (qs.home) setHome(qs.home);
          if (qs.away) setAway(qs.away);
          if (qs.cat) setCat(qs.cat);
        }, []);

        const doSearch = () => {
          setError("");
          setResult(null);
          const h = (home || "").trim();
          const a = (away || "").trim();
          const c = normCat(cat || "");
          if (!h || !a || !c) {
            setError("Completá los 3 campos (A, B y categoría).");
            return;
          }
          const r = findMatch(indexData, h, a, c);
          if (!r) {
            setError("No se encontró el cruce solicitado.");
            return;
          }
          setResult({ home: h, away: a, cat: c, ...r });
          setQS({ home: h, away: a, cat: c });
        };

        const updatedText = useMemo(() => {
          if (!lastModified) return "";
          try {
            const d = new Date(lastModified);
            return d.toLocaleString("es-AR", {
              dateStyle: "medium",
              timeStyle: "short",
            });
          } catch {
            return "";
          }
        }, [lastModified]);

        return (
          <ThemeProvider theme={theme}>
            <CssBaseline />
            <AppBar position="sticky" color="primary" elevation={0}>
              <Toolbar>
                <SportsSoccerIcon sx={{ mr: 1, color: "secondary.main" }} />
                <Typography variant="h6" sx={{ flexGrow: 1 }}>
                  EDEFI – Consultas
                </Typography>
                {updatedText && (
                  <Tooltip title="Última actualización de los JSON publicados">
                    <Typography variant="body2" color="text.secondary">
                      Actualizado: {updatedText}
                    </Typography>
                  </Tooltip>
                )}
              </Toolbar>
            </AppBar>

            <Container maxWidth="lg" sx={{ py: 3 }}>
              <Grid container spacing={2}>
                <Grid item xs={12} md={6}>
                  <Paper sx={{ p: 2 }}>
                    <Typography variant="subtitle1" gutterBottom>
                      Consulta de partido (A vs B)
                    </Typography>
                    <Grid container spacing={2}>
                      <Grid item xs={12} sm={6}>
                        <Autocomplete
                          freeSolo
                          options={teamOptions}
                          value={home}
                          onInputChange={(_, v) => setHome(v)}
                          renderInput={(params) => (
                            <TextField
                              {...params}
                              label="Equipo A (local)"
                              size="small"
                            />
                          )}
                        />
                      </Grid>
                      <Grid item xs={12} sm={6}>
                        <Autocomplete
                          freeSolo
                          options={teamOptions}
                          value={away}
                          onInputChange={(_, v) => setAway(v)}
                          renderInput={(params) => (
                            <TextField
                              {...params}
                              label="Equipo B (visitante)"
                              size="small"
                            />
                          )}
                        />
                      </Grid>
                      <Grid item xs={12} sm={6}>
                        <Autocomplete
                          freeSolo
                          options={[...CATS, ...CATS.map((c) => `20${c}`)]}
                          value={cat}
                          onInputChange={(_, v) => setCat(v)}
                          renderInput={(params) => (
                            <TextField
                              {...params}
                              label="Categoría (17 o 2017)"
                              size="small"
                            />
                          )}
                        />
                      </Grid>
                      <Grid item xs={12} sm="auto">
                        <Button
                          onClick={doSearch}
                          variant="contained"
                          color="primary"
                          startIcon={<SearchIcon />}
                          sx={{ height: "40px" }}
                        >
                          Buscar
                        </Button>
                      </Grid>
                    </Grid>

                    <Box sx={{ mt: 2 }}>
                      {loading && (
                        <Alert severity="info">
                          Cargando datos publicados…
                        </Alert>
                      )}
                      {!loading && error && (
                        <Alert severity="warning">{error}</Alert>
                      )}
                      {!loading && result && (
                        <Box sx={{ mt: 1 }}>
                          <Stack
                            direction="row"
                            spacing={1}
                            sx={{ mb: 1, flexWrap: "wrap" }}
                          >
                            <Chip
                              label={`Torneo: ${result.torneo}`}
                              color="secondary"
                              variant="filled"
                            />
                            <Chip
                              label={`Jornada: ${result.jornada}`}
                              color="primary"
                              variant="outlined"
                            />
                            {result.estado === "libre" && (
                              <Chip
                                label="Fecha libre – 3 pts admin."
                                color="success"
                                variant="outlined"
                              />
                            )}
                            {result.estado === "pendiente" && (
                              <Chip
                                label="Pendiente"
                                color="warning"
                                variant="outlined"
                              />
                            )}
                            <Chip
                              label={`Cat ${result.cat}`}
                              variant="outlined"
                            />
                          </Stack>
                          <Paper
                            variant="outlined"
                            sx={{ p: 2, backgroundColor: "background.paper" }}
                          >
                            <Typography sx={{ fontWeight: 600 }}>
                              {result.home} vs {result.away}
                            </Typography>
                            <Typography sx={{ mt: 0.5 }}>
                              Resultado: {result.resultado.local ?? "-"} -{" "}
                              {result.resultado.visitante ?? "-"}
                            </Typography>
                            <Typography
                              variant="body2"
                              color="text.secondary"
                              sx={{ mt: 0.5 }}
                            >
                              {result.nota}
                            </Typography>
                          </Paper>
                        </Box>
                      )}
                    </Box>
                  </Paper>
                </Grid>

                <Grid item xs={12} md={6}>
                  <Paper sx={{ p: 2 }}>
                    <Typography variant="subtitle1" gutterBottom>
                      GENERAL (Apertura, Clausura, Anual)
                    </Typography>
                    <Grid container spacing={2} sx={{ mb: 1 }}>
                      <Grid item xs={12} sm={6}>
                        <TextField
                          label="Filtrar por equipo"
                          size="small"
                          fullWidth
                          value={filterTeam}
                          onChange={(e) => setFilterTeam(e.target.value)}
                        />
                      </Grid>
                    </Grid>
                    <Box sx={{ overflowX: "auto" }}>
                      <Table size="small">
                        <TableHead>
                          <TableRow>
                            <TableCell sx={{ whiteSpace: "nowrap" }}>
                              #
                            </TableCell>
                            <TableCell
                              onClick={() => toggleSort("Equipo")}
                              sx={{ cursor: "pointer", whiteSpace: "nowrap" }}
                            >
                              Equipo
                            </TableCell>
                            {[
                              "Anual",
                              "Apertura",
                              "Clausura",
                              "Consistente",
                            ].map((k) => (
                              <TableCell
                                key={k}
                                onClick={() => toggleSort(k)}
                                sx={{ cursor: "pointer", whiteSpace: "nowrap" }}
                                align="right"
                              >
                                {k}{" "}
                                {orderBy === k
                                  ? orderDir === "desc"
                                    ? "▼"
                                    : "▲"
                                  : ""}
                              </TableCell>
                            ))}
                          </TableRow>
                        </TableHead>
                        <TableBody>
                          {compRows.slice(0, 1000).map((row, i) => (
                            <TableRow key={row.Equipo + i}>
                              <TableCell>{i + 1}</TableCell>
                              <TableCell>{row.Equipo}</TableCell>
                              <TableCell align="right">{row.Anual}</TableCell>
                              <TableCell align="right">
                                {row.Apertura}
                              </TableCell>
                              <TableCell align="right">
                                {row.Clausura}
                              </TableCell>
                              <TableCell align="right">
                                {row.Consistente ? "✓" : "✗"}
                              </TableCell>
                            </TableRow>
                          ))}
                          {!loading && compRows.length === 0 && (
                            <TableRow>
                              <TableCell colSpan={6}>
                                Sin datos disponibles.
                              </TableCell>
                            </TableRow>
                          )}
                        </TableBody>
                      </Table>
                    </Box>
                  </Paper>
                </Grid>

                <Grid item xs={12}>
                  <Box
                    sx={{ textAlign: "center", color: "text.secondary", mt: 2 }}
                  >
                    <Divider
                      sx={{ mb: 2, borderColor: "rgba(0,184,148,.2)" }}
                    />
                    <Typography variant="body2">
                      Datos generados automáticamente cada 6 h. Sitio estático
                      publicado en GitHub Pages.
                    </Typography>
                  </Box>
                </Grid>
              </Grid>
            </Container>
          </ThemeProvider>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
